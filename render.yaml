services:
  - type: web
    name: chengdu-metro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python metro_app.py
    envVars:
      - key: MODE
        value: prod
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
